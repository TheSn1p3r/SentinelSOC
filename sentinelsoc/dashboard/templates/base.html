<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}{% block title_suffix %}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>🛡️</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="dot" id="status-dot"></span>
        <span class="wordmark">Sentinel<span>SOC</span></span>
      </div>
      <nav class="nav">
        <a href="/" class="{{ 'active' if active_nav == 'overview' else '' }}">Overview</a>
        <a href="/alerts" class="{{ 'active' if active_nav == 'alerts' else '' }}">Alerts</a>
        <a href="/monitoring" class="{{ 'active' if active_nav == 'monitoring' else '' }}">Monitoring</a>
        <a href="/response" class="{{ 'active' if active_nav == 'response' else '' }}">Response</a>
      </nav>
      <div class="sidebar-footer">
        <form method="post" action="/logout"><button type="submit">Log out</button></form>
      </div>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>window.SENTINELSOC_REFRESH_SECONDS = {{ refresh_seconds }};</script>
  <script src="/static/dashboard.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
